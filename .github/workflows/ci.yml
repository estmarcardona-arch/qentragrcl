name: CI

on:
  push:
    branches: [main, "etapa/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # El build no se conecta a Supabase; valores públicos de relleno, no secretos.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

jobs:
  calidad:
    name: Calidad (prettier, lint, tsc, vitest, matriz, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run traceability
      - run: npm run versions
      - run: npm run build

  e2e:
    name: E2E y accesibilidad (Playwright + axe)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  base-de-datos:
    name: Base de datos (migraciones + pgTAP)
    runs-on: ubuntu-latest
    needs: calidad
    # Un solo job a la vez contra el proyecto Supabase de desarrollo.
    concurrency:
      group: supabase-dev
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Verificar secreto SUPABASE_DB_URL
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL en GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # En PR solo se simula; las migraciones se aplican al hacer push a etapa/** o main.
      - name: Migraciones (simulación)
        if: github.event_name == 'pull_request'
        run: npm run db:push -- --dry-run
      - name: Migraciones
        if: github.event_name != 'pull_request'
        run: npm run db:push
      - name: Pruebas pgTAP
        if: github.event_name != 'pull_request'
        run: npm run test:db
