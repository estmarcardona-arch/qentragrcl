name: CI

# En cada push y PR: instalar, prettier, lint, tsc, Vitest, matriz requisito→prueba, versiones;
# luego Supabase local (Docker del runner), migraciones, pgTAP, build y E2E + axe.
# No usa credenciales: la base es efímera y local al runner.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  calidad:
    name: Calidad (prettier, lint, tsc, vitest, matriz, versiones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run traceability
      - run: npm run versions

  integracion:
    name: Integración (Supabase local, migraciones, pgTAP, build, E2E)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Levantar Supabase local y aplicar migraciones
        # `supabase start` aplica supabase/migrations y seed.sql sobre una base vacía.
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Exportar variables públicas de la base local
        run: |
          npx supabase status -o json > /tmp/sb-status.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("/tmp/sb-status.json", "utf8"));
            const url = s.API_URL;
            const key = s.PUBLISHABLE_KEY || s.ANON_KEY;
            const admin = s.SERVICE_ROLE_KEY || s.SECRET_KEY;
            if (!url || !key || !admin) { console.error("Faltan API_URL o las claves en supabase status"); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_SUPABASE_URL=${url}\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${key}\nSUPABASE_SERVICE_ROLE_KEY=${admin}\n`);
            console.log("::add-mask::" + admin);
          '

      - name: Verificar variables
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Falta NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Falta la clave pública local"; exit 1; }

      - name: Pruebas pgTAP
        run: npm run test:db:local

      - name: Build
        run: npm run build
        env:
          ENABLE_DESIGN_PAGE: "true"

      - run: npx playwright install --with-deps chromium
      - name: E2E y accesibilidad
        run: npm run test:e2e
        env:
          # La base local tiene la semilla (usuarios del Prompt 0B) y el hook de bloqueo activo.
          E2E_SEED_USERS: "1"
          E2E_SEED_DOCS: "1"
          E2E_AUTH_HOOK: "1"
          E2E_ADMIN_API: "1"
          E2E_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Diagnóstico de autenticación (solo si falla)
        if: failure()
        run: |
          R=$(curl -s -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d '{"email":"diego.cardenas@grufarcol.test","password":"Grufarcol.Dev.2026"}')
          echo "::error title=Token de prueba::$(echo "$R" | head -c 600)"
          docker logs supabase_auth_grufarcol-ebr 2>&1 | grep -iE "error|hook|fail" | tail -8 | while read -r l; do
            echo "::warning title=Auth::$(echo "$l" | head -c 400)"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Detener Supabase
        if: always()
        run: npx supabase stop --no-backup
