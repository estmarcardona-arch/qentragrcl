<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;gap:6px;height:{{ h }}px;padding:0 {{ pr }}px 0 {{ pl }}px;border-radius:999px;background:{{ b.bg }};color:{{ b.fg }};box-shadow:inset 0 0 0 1px {{ b.bd }};font:600 {{ fs }}px/1 Inter,system-ui,sans-serif;white-space:nowrap"><dc-import name="Icon" glyph="{{ b.icon }}" size="{{ isz }}" hint-size="14px,14px"></dc-import>{{ b.label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:40},&quot;b&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,icon:string,bg:string,fg:string,bd:string}&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;sm&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const lg = this.props.size === 'lg';
    return { h: lg ? 32 : 24, fs: lg ? 14 : 12, isz: lg ? 18 : 14, pl: lg ? 12 : 8, pr: lg ? 14 : 10 };
  }
}
</script>
</body>
</html>
